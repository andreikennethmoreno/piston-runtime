version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: piston_api
    privileged: true
    restart: always
    ports:
      - "2000:2000"
    volumes:
      # This links your Windows folder to the required Linux folder
      - ./piston_packages:/piston
    environment:
      - PISTON_DATA_DIRECTORY=/piston
    tmpfs:
      - /tmp:exec