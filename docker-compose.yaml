version: '3.8'

services:
  api:
    # 🟢 CHANGE: Build from your local modified Dockerfile
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: piston_api
    restart: always
    privileged: true # Required for Piston's isolate sandbox
    ports:
      - 2000:2000
    # 🔴 REMOVED: No more volumes! Languages are now inside the image.
    tmpfs:
      - /tmp:exec